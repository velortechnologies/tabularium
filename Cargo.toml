[workspace]
resolver = "3"
members = ["tabularium", "tabularium-server", "tabularium-cli"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
version = "0.2.0"

[profile.release]
strip = true

# Keep SQLx 0.8 API compatibility while using the patched SQLite bindings.
[patch.crates-io]
sqlx-sqlite = { path = "vendor/sqlx-sqlite" }
